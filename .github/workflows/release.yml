name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Run Rust core tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish Tauri release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "saynow ${{ github.ref_name }}"
          releaseBody: |
            Windows 安装包见本 Release 附件。

            ## Change Log

            - 麦克风空闲即释放：录音流常驻但空闲时暂停（系统不再显示"正在使用麦克风"），录音启动仍为毫秒级，无 4-5 秒冷启动。
            - 识别/学习请求加入超时与共享连接池，失败可在浮窗一键重试。
            - 新增供应商"测试连接"、识别记录搜索/复制/删除、学习规则停用/固定/删除、词库别名编辑与去重。
            - 全局操作反馈（toast）与危险操作确认；纠错浮窗停留延长且悬停不关闭；录音浮条显示计时。
            - 首页新增今日用量与识别成功率。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          args: --features desktop

      - name: Build Tauri bundle
        if: github.ref_type != 'tag'
        run: npm run tauri -- build --features desktop

      - name: Upload Windows bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: saynow-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
